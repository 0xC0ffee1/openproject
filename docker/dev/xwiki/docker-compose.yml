services:
  web:
    image: "xwiki:${XWIKI_VERSION}-postgres-tomcat"
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wiki.rule=Host(`wiki.${OPENPROJECT_DOCKER_DEV_TLD:-local}`)"
      - "traefik.http.routers.wiki.entrypoints=websecure"
    ports:
      - "8080:8080"
    environment:
      - XWIKI_VERSION=${XWIKI_VERSION}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=xwiki-postgres-db
    volumes:
      - xwiki-data:/usr/local/xwiki
    networks:
      - bridge
      - external
  
  db:
    image: "postgres:18"
    container_name: xwiki-postgres-db
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_ROOT_PASSWORD=${POSTGRES_ROOT_PASSWORD}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8
    networks:
      - bridge

volumes:
  postgres-data: {}
  xwiki-data: {}

networks:
  bridge:
    driver: bridge
  external:
    name: gateway
    external: true